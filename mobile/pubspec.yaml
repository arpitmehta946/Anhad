name: anhad
description: "Anhad — a sanctuary for bhajans, mantras & stutis."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  # isar_community, not the original `isar`/`isar_flutter_libs` — the
  # original package is unmaintained (last release ~2023) and its
  # isar_flutter_libs Android module never added the `namespace` AGP 8+
  # requires, so it no longer builds. isar_community is a maintained fork
  # with an identical v3 API (docs/TECH_STACK.md §2).
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  video_player: ^2.9.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  # Prasad (share, docs/PRD.md §6) hands off to the OS share sheet — the
  # actual "distributing something blessed" act, not just a backend counter.
  share_plus: ^10.1.2
  # Jugalbandi (remix/duet, docs/PRD.md §7.2) records live camera video
  # alongside the source reel's playback — video_player above only ever
  # plays existing files, it has no capture capability.
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
